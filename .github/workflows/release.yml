name: Release extatt

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release extatt
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path main_extatt.lsp, README.md -DestinationPath extatt.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: extatt.zip
          generate_release_notes: true
